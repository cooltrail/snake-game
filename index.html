<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Snake</title>
  <meta name="description" content="A classic Snake game, playable in your browser." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23202124'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%2334a853'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=51" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="logo">Snake</h1>
      <div class="scores">
        <div class="score-box">
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-box">
          <span class="label">Best</span>
          <span id="best-score" class="value">0</span>
        </div>
        <div id="run-controls" class="run-controls hidden">
          <button id="pause-btn" class="hud-btn" type="button">Pause</button>
          <button id="stop-btn" class="hud-btn hud-btn-stop" type="button">Stop</button>
        </div>
      </div>
    </header>

    <main class="board-wrap">
      <canvas id="board" width="400" height="400"></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <h2 id="overlay-title">Snake</h2>
          <p id="overlay-message">Arrows, WASD, or the pad to move.</p>

          <div id="settings" class="settings">
            <div class="setting-group">
              <span class="setting-label">Mode</span>
              <div class="setting-options" data-setting="mode">
                <button class="setting-btn active" data-value="classic">Classic</button>
                <button class="setting-btn" data-value="ez">EZ</button>
                <button class="setting-btn" data-value="bomb">Bomb</button>
              </div>
            </div>
            <div class="setting-group">
              <span class="setting-label">Speed</span>
              <div class="setting-options" data-setting="speed">
                <button class="setting-btn" data-value="slow">Slow</button>
                <button class="setting-btn" data-value="normal">Normal</button>
                <button class="setting-btn active" data-value="fast">Fast</button>
              </div>
            </div>
            <div class="setting-group">
              <span class="setting-label">Snake skin</span>
              <div class="setting-options" data-setting="skin">
                <button class="setting-btn active" data-value="pixel">Pixel</button>
                <button class="setting-btn" data-value="smooth">Smooth</button>
              </div>
            </div>
            <div class="setting-group">
              <span class="setting-label">Color</span>
              <div class="setting-options" data-setting="color">
                <button class="setting-btn active" data-value="default">Default</button>
                <button class="setting-btn" data-value="frost">Frost</button>
                <button class="setting-btn" data-value="scorch">Scorch</button>
              </div>
            </div>
            <div class="setting-group">
              <span class="setting-label">Grid size</span>
              <div class="setting-options" data-setting="grid">
                <button class="setting-btn" data-value="small">Small</button>
                <button class="setting-btn active" data-value="medium">Medium</button>
                <button class="setting-btn" data-value="large">Large</button>
              </div>
            </div>
            <div class="setting-group">
              <span class="setting-label">Grid color</span>
              <div class="setting-options" data-setting="gridColor">
                <button class="setting-btn active" data-value="default">Default</button>
                <button class="setting-btn" data-value="red">Red</button>
                <button class="setting-btn" data-value="blue">Blue</button>
                <button class="setting-btn" data-value="green">Green</button>
              </div>
            </div>
            <div class="setting-group toggle-row">
              <span class="setting-label">3-2-1 countdown</span>
              <label class="toggle-switch">
                <input type="checkbox" id="countdown-toggle" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <button id="start-btn" class="primary-btn">Play</button>
        </div>
      </div>
    </main>

    <section class="controls" aria-label="Touch controls">
      <div class="dpad">
        <button class="dpad-btn up" data-dir="up" aria-label="Up">&#9650;</button>
        <button class="dpad-btn left" data-dir="left" aria-label="Left">&#9664;</button>
        <button class="dpad-btn down" data-dir="down" aria-label="Down">&#9660;</button>
        <button class="dpad-btn right" data-dir="right" aria-label="Right">&#9654;</button>
      </div>
    </section>

    <footer class="hint">
      Arrow keys / WASD to move &middot; Space to pause &middot; Swipe on the board also works
    </footer>
  </div>

  <script src="script.js?v=53"></script>
</body>
</html>
